name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 (ubuntu) AND aarch64 (macos): the pinned cross-vendor hashes must be
        # bit-identical on both, so running the suite on both turns every pinned-hash
        # test into a genuine cross-ISA gate instead of a single-platform assertion.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # The crate uses no nightly features and is published on stable, so CI
      # runs on stable too. Floating `nightly` was tracking the current compiler
      # and broke `main` on unrelated upstream codegen churn.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # --all-targets so examples/benches/tests compile too. A target-scoped build
      # (plain `cargo build`) misses them, so a broken example can pass CI while
      # `cargo test` — what a contributor actually types — fails.
      - name: Build (release, all targets)
        run: cargo build --release --all-targets

      # Lib tests include the pinned reduction/quant hashes; running them on both
      # runners is the cross-ISA bit-identity check.
      - name: Unit & determinism tests
        run: cargo test --release --lib

      # The transcendental determinism test is an integration test, so `--lib` never
      # ran it. Run it explicitly on both ISAs: its pinned hash must match on x86-64
      # and aarch64, which is the softfloat-path cross-vendor claim.
      - name: Cross-ISA transcendental determinism
        run: cargo test --release --test transcendental_determinism

      # Adversarial GGUF parser tests: malformed/hostile inputs must return Err
      # without panicking. The model-driven integration tests are #[ignore]d and
      # need a GGUF checkpoint that is not in CI, so they are intentionally skipped.
      - name: GGUF fuzz tests
        run: cargo test --release --test gguf_fuzz

  fuzz:
    name: fuzz smoke (GGUF parser, libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo-fuzz needs nightly (libFuzzer sanitizer flags). This job is separate from
      # the stable build/test job above so the crate itself still ships on stable.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Coverage-guided smoke over the UNTRUSTED-input surface: any panic, OOB read,
      # overflow, or OOM on a mutated input fails the build. A longer nightly run gives
      # depth (see fuzz/README.md); ~1 min each is enough to catch a regression in the
      # parser or in Config derivation (e.g. a divide-by-zero on hostile n_heads).
      - name: Fuzz gguf_parse (smoke)
        run: cargo fuzz run gguf_parse  -- -max_total_time=60 -max_len=262144 -rss_limit_mb=2048
      - name: Fuzz gguf_config (smoke)
        run: cargo fuzz run gguf_config -- -max_total_time=60 -max_len=262144 -rss_limit_mb=2048

  anchors:
    name: anchor guard (regime-manifest vs engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # regime-manifest.json is the published determinism anchor but nothing re-derived
      # it when the engine changed, so a digest-affecting change could drift it silently
      # (and once did). This job regenerates the anchors and asserts they still match.
      # It needs a real checkpoint; TinyLlama (668 MB) is the canonical conformance model
      # and small enough for hosted CI, cached so it downloads once. Mistral/Qwen are not
      # fetched here — the guard SKIPs any model whose checkpoint is absent, so this is a
      # genuine check on TinyLlama and a no-op (not a false pass) on the rest. A runner
      # that also has them extends the same guard (tools/check-anchors.sh).
      - name: Cache TinyLlama GGUF
        id: gguf
        uses: actions/cache@v4
        with:
          path: ci-models/tinyllama-1.1b-Q4_K_M.gguf
          key: gguf-tinyllama-1.1b-chat-v1.0-q4km

      - name: Fetch TinyLlama (on cache miss)
        if: steps.gguf.outputs.cache-hit != 'true'
        run: |
          mkdir -p ci-models
          curl -fL --retry 3 -o ci-models/tinyllama-1.1b-Q4_K_M.gguf \
            https://huggingface.co/TheBloke/TinyLlama-1.1B-Chat-v1.0-GGUF/resolve/main/tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf

      - name: Guard regime-manifest.json against the engine (serial / default)
        env:
          VITNI_GGUF_TINYLLAMA: ${{ github.workspace }}/ci-models/tinyllama-1.1b-Q4_K_M.gguf
        run: bash tools/check-anchors.sh

      # The anchors are the serial/default contract. A build that computes different
      # bits must fail here, not ship silently — that is exactly how the std-parallel
      # Q4_K kernel once diverged. (TinyLlama happens to agree under both paths, so the
      # hosted-CI model does not by itself exercise the divergence; run check-anchors.sh
      # with Mistral/Qwen on a runner that has them for full coverage. This pass still
      # guards the invariant and catches any regression that affects the CI model.)
      - name: Guard again under std-parallel (parallel build must match serial anchors)
        env:
          VITNI_GGUF_TINYLLAMA: ${{ github.workspace }}/ci-models/tinyllama-1.1b-Q4_K_M.gguf
          VITNI_ANCHOR_FEATURES: std-parallel
        run: bash tools/check-anchors.sh
