name: Optional PyTorch operators

on:
  push:
    branches: [main]
  pull_request:

jobs:
  wheel:
    name: wheel and CPU contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bindings/torch/native
      - name: Build tooling
        run: python -m pip install build pytest numpy
      - name: Install CPU PyTorch on Linux
        if: runner.os == 'Linux'
        run: python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyTorch on macOS
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.14.1
      - name: Build wheel and source distribution
        run: python -m build
      - name: Install the built wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Test installed package
        run: python -m pytest -q python/tests
      - uses: actions/upload-artifact@v4
        with:
          name: vitni-torch-${{ matrix.os }}
          path: dist/
